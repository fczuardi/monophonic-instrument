name: Publish PlatformIO package

on:
  push:
    tags:
      - "monophonic-instrument-v*"
      - "m5-tone-output-v*"

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            monophonic-instrument-v*)
              package="monophonic-instrument"
              consumer="ci/consumers/monophonic-package"
              test_command="env PLATFORMIO_CORE_DIR=.platformio-home pio test -d packages/monophonic-instrument -e native"
              version="${tag#monophonic-instrument-v}"
              ;;
            m5-tone-output-v*)
              package="m5-tone-output"
              consumer="ci/consumers/m5-tone-output"
              test_command=""
              version="${tag#m5-tone-output-v}"
              ;;
            *)
              echo "Unsupported package tag: $tag" >&2
              exit 2
              ;;
          esac

          manifest="packages/${package}/library.json"
          manifest_version="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$manifest")"

          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version '$version' does not match $manifest version '$manifest_version'." >&2
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "consumer=$consumer" >> "$GITHUB_OUTPUT"
          echo "test_command=$test_command" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-publish-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('packages/*/library.json', 'ci/consumers/**/platformio.ini', 'ci/consumers/**/src/main.cpp') }}
          restore-keys: |
            platformio-publish-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Run package tests
        if: steps.package.outputs.test_command != ''
        run: ${{ steps.package.outputs.test_command }}

      - name: Build isolated consumer
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d "${{ steps.package.outputs.consumer }}"

      - name: Pack package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack "packages/${{ steps.package.outputs.package }}" --output /tmp

      - name: Publish package to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORMIO_AUTH_TOKEN:-}" ]]; then
            echo "PLATFORMIO_AUTH_TOKEN secret is required." >&2
            exit 1
          fi
          env PLATFORMIO_CORE_DIR=.platformio-home \
            pio pkg publish "packages/${{ steps.package.outputs.package }}" \
              --type library \
              --no-interactive
